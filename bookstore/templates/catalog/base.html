<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Книжковий Магазин{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-link navbar-brand fw-bold" href="{% url 'catalog:book_list' %}">📚 Bookstore</a>
            <div class="navbar-nav ms-auto d-flex flex-row gap-2 align-items-center">
                <a class="btn btn-outline-light btn-sm" href="{% url 'catalog:book_list' %}">Категорії </a>
                <a class="btn btn-outline-light btn-sm" href="{% url 'blog:post_list' %}">Пости</a>
                <a class="btn btn-primary btn-sm" href="{% url 'register' %}">Зареєструватися</a>
                <a class="btn btn-outline-warning btn-sm" href="{% url 'cart:cart_detail' %}">🛒 Кошик</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
