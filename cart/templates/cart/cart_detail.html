<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Кошик</title>
</head>
<body>
    <h1>Ваш кошик</h1>

    {% if cart %}
        <table border="1" cellpadding="10" style="border-collapse: collapse; width: 100%;">
            <tr>
                <th>Назва</th>
                <th>Ціна</th>
                <th>Кількість</th>
                <th>Дії</th>
            </tr>
            {% for key, item in cart.items %}
                <tr>
                    <td>{{ item.title }}</td>
                    <td>{{ item.price }} грн</td>
                    <td>{{ item.quantity }} шт.</td>
                    <td>
                        <a href="{% url 'cart:cart_remove' key %}" style="color: red; text-decoration: none;">Видалити</a>
                    </td>
                </tr>
            {% endfor %}
        </table>
        <br>
        <p>
            <a href="{% url 'orders:order_create' %}" style="padding: 10px 15px; background-color: #28a745; color: white; text-decoration: none; border-radius: 4px;">Оформити замовлення</a>
        </p>
        <a href="{% url 'catalog:book_list' %}">Продовжити покупки</a>
    {% else %}
        <p>Ваш кошик порожній.</p>
        <a href="{% url 'catalog:book_list' %}">Повернутися до каталогу</a>
    {% endif %}
</body>
</html>
