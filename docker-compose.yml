services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bookstore_net

  redis:
    image: redis:7-alpine
    networks:
      - bookstore_net

  web:
    build: .
    command: gunicorn bookstore.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=bookstore.settings
    depends_on:
      - db
      - redis
    networks:
      - bookstore_net

  celery:
    build: .
    command: celery -A bookstore worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - bookstore_net

  celery-beat:
    build: .
    command: celery -A bookstore beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - bookstore_net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    networks:
      - bookstore_net

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  bookstore_net:
    driver: bridge